name: villishop_customer
description: "A production-grade hyperlocal village commerce application for Indian villages."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.1
  dio: ^5.5.0
  internet_connection_checker: ^1.0.0+1
  connectivity_plus: ^6.0.3
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  animations: ^2.0.11
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  firebase_messaging: ^15.0.1
  firebase_crashlytics: ^4.0.1
  socket_io_client: ^3.1.0
  flutter_local_notifications: ^17.1.2
  supabase_flutter: ^2.9.1
  google_maps_flutter: 2.7.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.3
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.2
  json_serializable: ^6.8.0
  freezed: ^2.5.2

dependency_overrides:
  google_maps_flutter_android: 2.14.0
  google_maps_flutter: 2.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/payment/
    - assets/icons/
    - assets/lottie/
